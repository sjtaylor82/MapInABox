name: Build and release Windows / macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: .github/workflows/publish-release.yml

      - name: Install build tools
        shell: powershell
        run: |
          python -m pip install --upgrade pip "setuptools<70" wheel
          python -m pip install pyinstaller wxPython numpy pandas pyarrow Pillow pygame shapely h3 timezonefinder pycountry accessible-output2 google-genai google-api-core proto-plus
          choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: powershell
        run: |
          python build.py install

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapInABox-Windows
          path: installer/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: .github/workflows/publish-release.yml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip "setuptools<70" wheel
          python -m pip install \
            pyinstaller \
            wxPython \
            numpy \
            pandas \
            Pillow \
            pygame \
            shapely \
            h3 \
            timezonefinder \
            pycountry \
            accessible-output2 \
            pyarrow \
            google-genai \
            google-api-core \
            proto-plus

      - name: Build macOS app bundle
        run: |
          python build.py mac

      - name: Stage and package macOS release
        run: |
          mkdir -p staging
          cp -r dist/MapInABox.app staging/MapInABox.app
          cp install-macos.sh staging/install-macos.sh
          cp README-macOS.txt staging/README.txt
          chmod +x staging/install-macos.sh
          cd staging && ditto -c -k --sequesterRsrc . ../MapInABox-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapInABox-macOS
          path: MapInABox-macOS.zip
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MapInABox-Windows
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MapInABox-macOS
          path: artifacts/macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*.exe
            artifacts/macos/*.zip
          generate_release_notes: true

  update-winget:
    needs: publish-release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Derive winget version from release asset
        id: ver
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"          # e.g. v1.0.0.1

          # Look up the actual release assets instead of guessing the filename
          # from the tag - the tag and the app's internal version string can
          # drift apart (see update-winget failure on v1.0.0.10).
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "MapInABox-release-workflow" }
          $release = Invoke-RestMethod -Headers $headers `
            "https://api.github.com/repos/sjtaylor82/MapInABox/releases/tags/$tag"

          $asset = $release.assets | Where-Object { $_.name -match '^MapInABox-.+-setup\.exe$' } | Select-Object -First 1
          if (-not $asset) {
            Write-Error "No MapInABox-*-setup.exe asset found on release $tag"
            exit 1
          }

          # Pull the real app version out of the asset filename itself, so it
          # always matches what was actually built and uploaded.
          if ($asset.name -notmatch '^MapInABox-(?<ver>[\d.]+)-setup\.exe$') {
            Write-Error "Could not parse version out of asset name '