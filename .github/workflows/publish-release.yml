name: Build and release Windows / macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install build tools
        shell: powershell
        run: |
          python -m pip install --upgrade pip "setuptools<70" wheel
          python -m pip install -r requirements.txt
          choco install innosetup -y --no-progress

      - name: Build Windows installer (Pro)
        shell: powershell
        run: |
          python build.py install
          Copy-Item -LiteralPath dist\MapInABox\_internal\update-manifest.json `
            -Destination MapInABox-Windows-update.json

      - name: Build Windows portable zip (Pro)
        shell: powershell
        run: |
          New-Item -Path dist\MapInABox\_internal\_portable -ItemType File -Force
          $soundFiles = @(Get-ChildItem -LiteralPath dist\MapInABox\_internal\sounds -Recurse -File)
          if ($soundFiles.Count -lt 2 -or -not (Test-Path -LiteralPath dist\MapInABox\_internal\sounds\credits.txt)) {
            throw "Portable sound library is empty or incomplete."
          }
          Compress-Archive -Path dist\MapInABox -DestinationPath MapInABox-Windows-portable.zip -Force

      - name: Build Windows installer (Education)
        shell: powershell
        run: |
          python build.py install education
          Copy-Item -LiteralPath dist\MapInABox\_internal\update-manifest.json `
            -Destination MapInABox-Windows-Education-update.json

      - name: Build Windows portable zip (Education)
        shell: powershell
        run: |
          # build.py already dropped _education into this fresh dist (PyInstaller
          # --clean rebuilds it above) - add the portable marker on top of it.
          New-Item -Path dist\MapInABox\_internal\_portable -ItemType File -Force
          if (-not (Test-Path -LiteralPath dist\MapInABox\_internal\_education)) {
            throw "Education marker missing from dist - build.py did not run in education mode."
          }
          $soundFiles = @(Get-ChildItem -LiteralPath dist\MapInABox\_internal\sounds -Recurse -File)
          if ($soundFiles.Count -lt 2 -or -not (Test-Path -LiteralPath dist\MapInABox\_internal\sounds\credits.txt)) {
            throw "Portable sound library is empty or incomplete."
          }
          Compress-Archive -Path dist\MapInABox -DestinationPath MapInABox-Windows-Education-portable.zip -Force

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapInABox-Windows
          path: |
            installer/*.exe
            MapInABox-Windows-portable.zip
            MapInABox-Windows-Education-portable.zip
            MapInABox-Windows-update.json
            MapInABox-Windows-Education-update.json
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip "setuptools<70" wheel
          python -m pip install -r requirements.txt

      - name: Build macOS app bundle
        run: |
          python build.py mac

      - name: Stage and package macOS release
        run: |
          mkdir -p staging
          cp -r dist/MapInABox.app staging/MapInABox.app
          cp install-macos.sh staging/install-macos.sh
          cp README-macOS.txt staging/README.txt
          cp LICENSE staging/LICENSE
          cp THIRD_PARTY_NOTICES.txt staging/THIRD_PARTY_NOTICES.txt
          chmod +x staging/install-macos.sh
          cd staging && ditto -c -k --sequesterRsrc . ../MapInABox-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapInABox-macOS
          path: MapInABox-macOS.zip
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MapInABox-Windows
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MapInABox-macOS
          path: artifacts/macos

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd artifacts
          find windows macos -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.json' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/**/*.exe
            artifacts/windows/**/*.zip
            artifacts/windows/**/*.json
            artifacts/macos/**/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true

  update-winget:
    needs: publish-release
    runs-on: windows-latest
    # Paused: winget submissions have been getting caught by the winget-pkgs
    # backend's own Defender scan (see PR #401371), which is a separate,
    # stricter check than what real users see when they download and run
    # the installer directly - it doesn't affect anyone using GitHub
    # Releases. Not worth chasing manually right now; revisit once the app
    # is code-signed (should make this pass cleanly). Change `false` to
    # re-enable.
    if: false && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Derive winget version from release asset
        id: ver
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"          # e.g. v1.0.0.1

          # Look up the actual release assets instead of guessing the filename
          # from the tag - the tag and the app's internal version string can
          # drift apart (see update-winget failure on v1.0.0.10).
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "MapInABox-release-workflow" }
          $release = Invoke-RestMethod -Headers $headers `
            "https://api.github.com/repos/sjtaylor82/MapInABox/releases/tags/$tag"

          $asset = $release.assets | Where-Object { $_.name -match '^MapInABox-.+-setup\.exe$' } | Select-Object -First 1
          if (-not $asset) {
            Write-Error "No MapInABox-*-setup.exe asset found on release $tag"
            exit 1
          }

          # Pull the real app version out of the asset filename itself, so it
          # always matches what was actually built and uploaded.
          if ($asset.name -notmatch '^MapInABox-(?<ver>[\d.]+)-setup\.exe$') {
            Write-Error "Could not parse version out of asset name '$($asset.name)'"
            exit 1
          }
          $appVer = $Matches.ver
          $wingetVer = "$appVer.0"                  # e.g. 1.0.0.1.0
          $url = "$($asset.browser_download_url)|x64"

          if ($appVer -ne $tag.TrimStart('v')) {
            Write-Warning "Tag is $tag but asset version is $appVer - proceeding with the asset version."
          }

          echo "winget_version=$wingetVer" >> $env:GITHUB_OUTPUT
          echo "installer_url=$url"        >> $env:GITHUB_OUTPUT

      - name: Install wingetcreate
        shell: powershell
        run: |
          $releases = Invoke-RestMethod "https://api.github.com/repos/microsoft/winget-create/releases/latest"
          $asset = $releases.assets | Where-Object { $_.name -eq "wingetcreate.exe" } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile wingetcreate.exe

      - name: Submit winget update
        shell: powershell
        run: |
          .\wingetcreate.exe update SamTaylor.MapInABox `
            --version "${{ steps.ver.outputs.winget_version }}" `
            --urls "${{ steps.ver.outputs.installer_url }}" `
            --submit `
            --token "${{ secrets.WINGET_TOKEN }}"
